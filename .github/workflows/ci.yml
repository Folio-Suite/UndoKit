name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify producer toolchain
        run: ruby scripts/check-toolchain.rb
      - name: Test package
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: swift test --configuration "$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
      - name: Run independent package and native consumers on macOS and iOS simulator
        run: scripts/check-consumer.sh --route both --platform both --configuration ${{ matrix.configuration }}
