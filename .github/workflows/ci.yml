name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify producer toolchain
        run: ruby scripts/check-toolchain.rb
      - name: Approve pinned SwiftLint build plugin
        run: |
          ruby -rjson -rfileutils <<'RUBY'
          # Trust only the reviewed plugin revision, matching local Xcode approval.
          revision = "ef7d692fc6706e8f5628e26bcafaefa445c58a97"
          resolved = JSON.parse(File.read("UndoKit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"))
          pin = resolved.fetch("pins").find { |item| item.fetch("identity") == "swiftlintplugins" }
          abort "Review SwiftLint plugin trust after changing its dependency pin" unless
            pin && pin.fetch("state").fetch("revision") == revision &&
            pin.fetch("location") == "https://github.com/SimplyDanny/SwiftLintPlugins"
          directory = File.join(Dir.home, ".swiftpm", "security")
          FileUtils.mkdir_p(directory)
          File.write(File.join(directory, "plugins.json"), JSON.pretty_generate([
            {"fingerprint" => revision, "packageIdentity" => "swiftlintplugins",
             "targetName" => "SwiftLintBuildToolPlugin"}
          ]) + "\n")
          RUBY
      - name: Test package
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: swift test --configuration "$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
      - name: Run independent package and native consumers on macOS and iOS simulator
        run: scripts/check-consumer.sh --route both --platform both --configuration ${{ matrix.configuration }}
