name: Versioned documentation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage a DocC candidate, publish an approved release asset, or run the legacy Pages operation
        required: true
        type: choice
        options: [stage, stage-correction, promote, promote-correction, publish-asset]
      source_commit:
        description: Full source commit SHA to build for stage or stage-correction
        required: false
        type: string
      version:
        description: Three-part documentation version for stage or stage-correction
        required: false
        type: string
      channel:
        description: Candidate channel when operation is stage
        required: false
        default: release
        type: choice
        options: [release, development]
      candidate_run_id:
        description: Actions run ID containing undokit-docs-candidate when operation is promote or publish-asset
        required: false
        type: string
      correction_note:
        description: Visible guidance correction reason for stage-correction
        required: false
        type: string
      correction_manifest_sha256:
        description: Exact reviewed correction-provenance.json SHA-256 required for promote-correction
        required: false
        type: string
      initialize_snapshots:
        description: Initialize documentation-snapshots only for the first deployment when Pages has no prior site
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: github-pages-documentation
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

defaults:
  run:
    shell: bash

jobs:
  stage:
    if: ${{ inputs.operation == 'stage' || inputs.operation == 'stage-correction' }}
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - name: Validate selected source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_commit must be a full commit SHA" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must have three numeric components" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Capture source build and toolchain provenance
        run: |
          ruby tooling/scripts/documentation/site.rb build \
            --source source \
            --derived-data "$RUNNER_TEMP/undokit-docs-derived" \
            --producer-output "$RUNNER_TEMP/undokit-docs-producer.json"
      - name: Stage release or development documentation
        if: ${{ inputs.operation == 'stage' }}
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          SOURCE_COMMIT=$(git -C source rev-parse HEAD)
          if [[ "$CHANNEL" == release ]]; then
            BASE_PATH="/UndoKit/versions/$VERSION/"
          else
            BASE_PATH="/UndoKit/development/$SOURCE_COMMIT/"
          fi
          ruby tooling/scripts/documentation/site.rb stage \
            --archive "$RUNNER_TEMP/undokit-docs-derived/Build/Products/Debug/UndoKit.doccarchive" \
            --producer "$RUNNER_TEMP/undokit-docs-producer.json" \
            --output "$RUNNER_TEMP/undokit-docs-candidate" \
            --version "$VERSION" --channel "$CHANNEL" --base-path "$BASE_PATH"
      - name: Stage a bounded guidance correction
        if: ${{ inputs.operation == 'stage-correction' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CORRECTION_NOTE: ${{ inputs.correction_note }}
        run: |
          mkdir release-provenance
          gh release download "$VERSION" --repo Folio-Suite/UndoKit --pattern "UndoKit-$VERSION-manifest.json" --dir release-provenance
          git -C tooling fetch origin refs/heads/documentation-snapshots:refs/remotes/origin/documentation-snapshots
          git -C tooling worktree add --detach "$RUNNER_TEMP/undokit-docs-prior" origin/documentation-snapshots
          ruby tooling/scripts/documentation/site.rb stage-correction \
            --archive "$RUNNER_TEMP/undokit-docs-derived/Build/Products/Debug/UndoKit.doccarchive" \
            --producer "$RUNNER_TEMP/undokit-docs-producer.json" \
            --output "$RUNNER_TEMP/undokit-docs-candidate" \
            --source source --release-provenance "release-provenance/UndoKit-$VERSION-manifest.json" \
            --previous-snapshot "$RUNNER_TEMP/undokit-docs-prior/versions/$VERSION" \
            --correction "$CORRECTION_NOTE"
          shasum -a 256 "$RUNNER_TEMP/undokit-docs-candidate/correction-provenance.json"
      - name: Pack the unchanged documentation candidate for artifact transport
        run: |
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/undokit-docs-candidate.tar" \
            -C "$RUNNER_TEMP/undokit-docs-candidate" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: undokit-docs-candidate
          path: ${{ runner.temp }}/undokit-docs-candidate.tar
          if-no-files-found: error
          retention-days: 90

  promote:
    if: ${{ inputs.operation == 'promote' || inputs.operation == 'promote-correction' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: undokit-docs-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate-transport
      - name: Restore the unchanged documentation candidate
        run: |
          mkdir candidate
          tar -xf candidate-transport/undokit-docs-candidate.tar -C candidate
      - name: Validate selected promotion and correction source identity
        id: identity
        env:
          OPERATION: ${{ inputs.operation }}
          CORRECTION_SHA: ${{ inputs.correction_manifest_sha256 }}
        run: |
          if [[ "$OPERATION" == promote-correction ]]; then
            [[ "$CORRECTION_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "promote-correction requires the exact reviewed correction manifest SHA-256" >&2; exit 1; }
            DOC_SOURCE=$(ruby -rjson -e 'puts JSON.parse(File.read("candidate/manifest.json")).fetch("documentationSourceCommit")')
            [[ "$DOC_SOURCE" =~ ^[0-9a-f]{40}$ ]] || { echo "documentation source must be a full commit SHA" >&2; exit 1; }
            echo "documentation_source=$DOC_SOURCE" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.operation == 'promote-correction' }}
        with:
          ref: ${{ steps.identity.outputs.documentation_source }}
          path: documentation-source
          fetch-depth: 0
          persist-credentials: false
      - name: Download retained candidate manifest from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(ruby -rjson -e 'puts JSON.parse(File.read("candidate/manifest.json")).fetch("version")')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "candidate version is invalid" >&2; exit 1; }
          mkdir release-provenance
          gh release download "$VERSION" --repo Folio-Suite/UndoKit --pattern "UndoKit-$VERSION-manifest.json" --dir release-provenance
      - name: Verify approved release and source tag
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          CORRECTION_SHA: ${{ inputs.correction_manifest_sha256 }}
        run: |
          VERSION=$(ruby -rjson -e 'puts JSON.parse(File.read("candidate/manifest.json")).fetch("version")')
          CORRECTION_ARGS=()
          if [[ "$OPERATION" == promote-correction ]]; then
            CORRECTION_ARGS=(--source documentation-source --correction-provenance candidate/correction-provenance.json --approved-correction-sha256 "$CORRECTION_SHA")
          fi
          ruby tooling/scripts/documentation/site.rb verify-release --artifact candidate \
            --release-provenance "release-provenance/UndoKit-$VERSION-manifest.json" "${CORRECTION_ARGS[@]}"
      - name: Load prior successful snapshots
        run: |
          STATE="$RUNNER_TEMP/undokit-docs-state"
          set +e
          git -C tooling ls-remote --exit-code --heads origin documentation-snapshots >/dev/null
          STATE_REF_STATUS=$?
          set -e
          if [[ "$STATE_REF_STATUS" == 0 ]]; then
            git -C tooling fetch origin refs/heads/documentation-snapshots:refs/remotes/origin/documentation-snapshots
            git -C tooling worktree add --detach "$STATE" origin/documentation-snapshots
          elif [[ "$STATE_REF_STATUS" == 2 && "${{ inputs.initialize_snapshots }}" == true ]]; then
            git -C tooling worktree add --orphan -b documentation-snapshots "$STATE"
          elif [[ "$STATE_REF_STATUS" == 2 ]]; then
            echo "documentation-snapshots is missing; initialize it only for the first deployment after confirming Pages has no prior site" >&2
            exit 1
          else
            echo "could not read the documentation snapshot branch" >&2
            exit "$STATE_REF_STATUS"
          fi
          mkdir public
          rsync -a --delete --exclude=.git "$STATE/" public/
      - name: Promote immutable snapshot and latest entry
        env:
          OPERATION: ${{ inputs.operation }}
          CORRECTION_SHA: ${{ inputs.correction_manifest_sha256 }}
        run: |
          VERSION=$(ruby -rjson -e 'puts JSON.parse(File.read("candidate/manifest.json")).fetch("version")')
          CORRECTION_ARGS=()
          if [[ "$OPERATION" == promote-correction ]]; then
            CORRECTION_ARGS=(--source documentation-source --correction-provenance candidate/correction-provenance.json --approved-correction-sha256 "$CORRECTION_SHA")
          fi
          ruby tooling/scripts/documentation/site.rb promote --artifact candidate \
            --release-provenance "release-provenance/UndoKit-$VERSION-manifest.json" --destination public "${CORRECTION_ARGS[@]}"
          ruby tooling/scripts/documentation/site.rb update-latest --artifact candidate \
            --release-provenance "release-provenance/UndoKit-$VERSION-manifest.json" --destination public "${CORRECTION_ARGS[@]}"
          touch public/.nojekyll
      - name: Retain additive immutable correction provenance
        if: ${{ inputs.operation == 'promote-correction' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CORRECTION_SHA: ${{ inputs.correction_manifest_sha256 }}
        run: |
          VERSION=$(ruby -rjson -e 'puts JSON.parse(File.read("candidate/manifest.json")).fetch("version")')
          ruby tooling/scripts/documentation/site.rb publish-correction-provenance --artifact candidate \
            --release-provenance "release-provenance/UndoKit-$VERSION-manifest.json" \
            --source documentation-source --correction-provenance candidate/correction-provenance.json \
            --approved-correction-sha256 "$CORRECTION_SHA"
      - name: Record preserved release snapshots
        run: |
          STATE="$RUNNER_TEMP/undokit-docs-state"
          rsync -a --delete --exclude=.git public/ "$STATE/"
          git -C "$STATE" config user.name "github-actions[bot]"
          git -C "$STATE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$STATE" add -A
          if ! git -C "$STATE" diff --cached --quiet; then
            git -C "$STATE" commit -m "Publish versioned UndoKit documentation"
            git -C "$STATE" push origin HEAD:refs/heads/documentation-snapshots
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Report incomplete correction publication
        if: ${{ failure() && inputs.operation == 'promote-correction' }}
        run: |
          echo "Correction publication is incomplete. An additive provenance asset or snapshot commit may already exist; the prior hosted site remains authoritative until Pages succeeds. Retry the same approved identity after inspecting the failed step." >&2

  publish-asset:
    if: ${{ inputs.operation == 'publish-asset' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: undokit-docs-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate-transport
      - name: Restore the unchanged documentation candidate
        run: |
          mkdir candidate
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = "candidate-transport/undokit-docs-candidate.tar"
          destination = pathlib.Path("candidate")
          with tarfile.open(archive, "r:") as bundle:
              members = bundle.getmembers()
              for member in members:
                  name = pathlib.PurePosixPath(member.name)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"unsafe candidate path: {member.name}")
                  parts = tuple(part for part in name.parts if part not in ("", "."))
                  if parts and parts[0] not in {"archive", "site", "producer.json", "manifest.json"}:
                      raise SystemExit(f"unexpected candidate path: {member.name}")
                  if member.issym() or member.islnk() or not (member.isdir() or member.isfile()):
                      raise SystemExit(f"unsupported candidate entry: {member.name}")
              bundle.extractall(destination, members=members, filter="data")
          PY
      - name: Download the published release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must have three numeric components" >&2; exit 1; }
          mkdir release-provenance
          gh release download "$VERSION" --repo Folio-Suite/UndoKit --pattern "UndoKit-$VERSION-manifest.json" --dir release-provenance
      - name: Validate and package the candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ruby tooling/scripts/documentation/release-asset.rb --artifact candidate \
            --release-provenance "release-provenance/UndoKit-$VERSION-manifest.json" \
            --output "$RUNNER_TEMP/UndoKit-$VERSION-documentation.tar.gz"
      - name: Upload the immutable documentation asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release upload "$VERSION" "$RUNNER_TEMP/UndoKit-$VERSION-documentation.tar.gz" --repo Folio-Suite/UndoKit
