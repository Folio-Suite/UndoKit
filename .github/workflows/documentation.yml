name: Versioned documentation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage a DocC candidate or promote an approved release candidate
        required: true
        type: choice
        options: [stage, promote]
      source_commit:
        description: Full source commit SHA to build when operation is stage
        required: false
        type: string
      version:
        description: Three-part documentation version when operation is stage
        required: false
        type: string
      channel:
        description: Candidate channel when operation is stage
        required: false
        default: release
        type: choice
        options: [release, development]
      candidate_run_id:
        description: Actions run ID containing undokit-docs-candidate when operation is promote
        required: false
        type: string
      correction_note:
        description: Visible reason when correcting an existing version snapshot
        required: false
        type: string
      initialize_snapshots:
        description: Initialize documentation-snapshots only for the first deployment when Pages has no prior site
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: github-pages-documentation
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

defaults:
  run:
    shell: bash

jobs:
  stage:
    if: ${{ inputs.operation == 'stage' }}
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - name: Validate selected source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_commit must be a full commit SHA" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must have three numeric components" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Capture source build and toolchain provenance
        run: |
          ruby tooling/scripts/documentation/site.rb build \
            --source source \
            --derived-data "$RUNNER_TEMP/undokit-docs-derived" \
            --producer-output "$RUNNER_TEMP/undokit-docs-producer.json"
      - name: Stage release or development documentation
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          SOURCE_COMMIT=$(git -C source rev-parse HEAD)
          if [[ "$CHANNEL" == release ]]; then
            BASE_PATH="/UndoKit/versions/$VERSION/"
          else
            BASE_PATH="/UndoKit/development/$SOURCE_COMMIT/"
          fi
          ruby tooling/scripts/documentation/site.rb stage \
            --archive "$RUNNER_TEMP/undokit-docs-derived/Build/Products/Debug/UndoKit.doccarchive" \
            --producer "$RUNNER_TEMP/undokit-docs-producer.json" \
            --output "$RUNNER_TEMP/undokit-docs-candidate" \
            --version "$VERSION" --channel "$CHANNEL" --base-path "$BASE_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: undokit-docs-candidate
          path: ${{ runner.temp }}/undokit-docs-candidate/
          if-no-files-found: error
          retention-days: 90

  promote:
    if: ${{ inputs.operation == 'promote' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: undokit-docs-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify approved release and source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby tooling/scripts/documentation/site.rb verify-release --artifact candidate
      - name: Load prior successful snapshots
        run: |
          STATE="$RUNNER_TEMP/undokit-docs-state"
          set +e
          git -C tooling ls-remote --exit-code --heads origin documentation-snapshots >/dev/null
          STATE_REF_STATUS=$?
          set -e
          if [[ "$STATE_REF_STATUS" == 0 ]]; then
            git -C tooling fetch origin refs/heads/documentation-snapshots:refs/remotes/origin/documentation-snapshots
            git -C tooling worktree add --detach "$STATE" origin/documentation-snapshots
          elif [[ "$STATE_REF_STATUS" == 2 && "${{ inputs.initialize_snapshots }}" == true ]]; then
            git -C tooling worktree add --orphan -b documentation-snapshots "$STATE"
          elif [[ "$STATE_REF_STATUS" == 2 ]]; then
            echo "documentation-snapshots is missing; initialize it only for the first deployment after confirming Pages has no prior site" >&2
            exit 1
          else
            echo "could not read the documentation snapshot branch" >&2
            exit "$STATE_REF_STATUS"
          fi
          mkdir public
          rsync -a --delete --exclude=.git "$STATE/" public/
      - name: Promote immutable snapshot and latest entry
        env:
          GH_TOKEN: ${{ github.token }}
          CORRECTION_NOTE: ${{ inputs.correction_note }}
        run: |
          if [[ -n "$CORRECTION_NOTE" ]]; then
            ruby tooling/scripts/documentation/site.rb promote --artifact candidate --destination public --correction "$CORRECTION_NOTE"
          else
            ruby tooling/scripts/documentation/site.rb promote --artifact candidate --destination public
          fi
          ruby tooling/scripts/documentation/site.rb update-latest --artifact candidate --destination public
          touch public/.nojekyll
      - name: Record preserved release snapshots
        run: |
          STATE="$RUNNER_TEMP/undokit-docs-state"
          rsync -a --delete --exclude=.git public/ "$STATE/"
          git -C "$STATE" config user.name "github-actions[bot]"
          git -C "$STATE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$STATE" add -A
          if ! git -C "$STATE" diff --cached --quiet; then
            git -C "$STATE" commit -m "Publish versioned UndoKit documentation"
            git -C "$STATE" push origin HEAD:refs/heads/documentation-snapshots
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
