# Adapted from the Folio Suite root SwiftLint configuration.

check_for_updates: false
reporter: xcode
strict: false

included:
  - UndoKit
  - UndoKitTests

opt_in_rules:
  # Product safety and lifecycle mistakes.
  - discarded_notification_center_observer
  - fallthrough
  - fatal_error_message
  - identical_operands
  - optional_enum_case_matching
  - overridden_super_call
  - prohibited_super_call
  - return_value_from_void_function
  - unhandled_throwing_task
  - unowned_variable_capture
  - weak_delegate
  - yoda_condition

  # Collection correctness and avoidable work.
  - array_init
  - contains_over_filter_count
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - reduce_into
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

  # Test quality.
  - empty_xctest_method
  - test_case_accessibility
  - xct_specific_matcher
  - xctfail_message

type_name:
  excluded:
    - ID

trailing_comma:
  mandatory_comma: true

file_length:
  warning: 400
  error: 1000
